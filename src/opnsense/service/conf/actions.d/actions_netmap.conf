[scan.start]
command:/usr/local/opnsense/scripts/netmap/scan.py start
parameters:%s %s %s
type:script_output
message:starting a port scan of %s (%s, %s)

[scan.status]
command:/usr/local/opnsense/scripts/netmap/scan.py status
parameters:%s
type:script_output
message:reading the port scans of %s

[scan.list]
command:/usr/local/opnsense/scripts/netmap/scan.py list
parameters:
type:script_output
message:listing the port scans
